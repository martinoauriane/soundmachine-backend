services:
  db:
    container_name: soundmachine-db
    image: postgres:latest
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB_NAME: ${POSTGRES_DB_NAME}
    ports:
      - "5432:5432"
  api:
    container_name: soundmachine-api
    depends_on:
      - db
    build:
      context: .
      dockerfile: ./Dockerfile
    environment:
      POSTGRES_URL: ${POSTGRES_URL}
    ports:
      - "5000:5000"
